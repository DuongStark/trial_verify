worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 2m;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  upstream account_trial_upstream {
    server account-trial:3001;
  }

  upstream graph_risk_upstream {
    server graph-risk:3002;
  }

  upstream fraud_case_upstream {
    server fraud-case:3003;
  }

  server {
    listen 80;
    server_name _;

    # Health endpoints: public path -> service /health
    location = /api/health/account {
      proxy_pass http://account_trial_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    location = /api/health/risk {
      proxy_pass http://graph_risk_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    location = /api/health/case {
      proxy_pass http://fraud_case_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    # Future business routes
    location /api/auth/ {
      proxy_pass http://account_trial_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
    }

    location /api/users/ {
      proxy_pass http://account_trial_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
    }

    location /api/trials/ {
      proxy_pass http://account_trial_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
    }

    location /api/admin/ {
      proxy_pass http://account_trial_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
    }

    location /api/risk/ {
      proxy_pass http://graph_risk_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
    }

    location /api/cases/ {
      proxy_pass http://fraud_case_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
    }

    location /api/dashboard/ {
      proxy_pass http://fraud_case_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
    }

    # Internal APIs must never be exposed by the gateway.
    location /internal/ {
      return 404;
    }

    location / {
      return 404;
    }
  }
}
